<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>USICONTROL</title>

<style>

body{
margin:0;
background:#020d1f;
font-family:Arial;
color:white;
}

.header{
padding:25px;
border-bottom:1px solid #1d2d4d;
}

.logo{
font-size:38px;
font-weight:bold;
color:#ff7a00;
}

.sub{
color:#8fa4c5;
margin-top:8px;
}

.boxEmail{
margin:20px;
background:#2a1b14;
border:1px solid #9f5620;
padding:18px;
border-radius:12px;
}

.menu{
padding:20px;
}

.titulo{
font-size:32px;
font-weight:bold;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
font-size:15px;
}

th{
background:#09172d;
padding:15px;
text-align:left;
}

td{
padding:15px;
border-bottom:1px solid #13223d;
}

.status{
background:#103d17;
padding:8px 14px;
border-radius:20px;
display:inline-block;
}

</style>
</head>
<body>

<div class="header">

<div class="logo">USICONTROL</div>

<div class="sub">
WCH usinagem — Painel da empresa
</div>

</div>


<div class="boxEmail">

<b>E-mail de importação</b><br><br>

pedidos.usicontrol@gmail.com

</div>


<div class="menu">

<div class="titulo">
Pedidos Importados
</div>


<table>

<thead>

<tr>
<th>Status</th>
<th>Cliente</th>
<th>Código</th>
<th>Descrição</th>
<th>Qtd</th>
</tr>

</thead>

<tbody id="listaPedidos">

</tbody>

</table>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getDatabase,
ref,
onValue
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig = {

apiKey:"SUA_API_KEY",

authDomain:"usicontrol-a84cf.firebaseapp.com",

databaseURL:
"https://usicontrol-a84cf-default-rtdb.firebaseio.com",

projectId:"usicontrol-a84cf"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


const tabela =
document.getElementById("listaPedidos");


onValue(

ref(db,"pedidos"),

(snapshot)=>{

const dados = snapshot.val();

tabela.innerHTML="";


if(!dados){

tabela.innerHTML=
"<tr><td colspan='5'>Nenhum pedido encontrado.</td></tr>";

return;

}


Object.values(dados).forEach(empresa=>{

Object.values(empresa).forEach(pedido=>{

tabela.innerHTML += `

<tr>

<td>

<span class="status">

${pedido.status || "Novo"}

</span>

</td>

<td>${pedido.cliente || "-"}</td>

<td>${pedido.codigo || "-"}</td>

<td>${pedido.descricao || "-"}</td>

<td>${pedido.qtd || "-"}</td>

</tr>

`;

});

});

});

</script>

</body>
</html>
